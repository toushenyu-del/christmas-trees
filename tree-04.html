<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07020f">
<title>霓虹线框 · Neon Wireframe</title>
<style>
  :root { --void: #07020f; --magenta: #ff2bd6; --cyan: #00f0ff; --volt: #ffe66b; }
  html, body { margin: 0; height: 100%; background: var(--void); overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; }
  #c, #bgc { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #c { touch-action: none; cursor: ew-resize; }
  #bgc { inset: 0 -20px; width: calc(100% + 40px); will-change: transform; }
  .crt { position: fixed; inset: 0; pointer-events: none;
    background:
      repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse 120% 100% at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%); }
  .crt::after { content: ''; position: absolute; left: 0; right: 0; top: -20%; height: 18%;
    background: linear-gradient(to bottom, transparent, rgba(160,120,255,.05), transparent);
    animation: sweep 7s linear infinite; }
  @keyframes sweep { to { transform: translateY(700%); } }
  .sign {
    position: fixed; display: flex; flex-direction: column; align-items: center; margin: 0; pointer-events: none; line-height: 1.12;
    font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', 'Source Han Sans SC', sans-serif; font-weight: 700;
    color: #ffe3fa; padding: .42em .36em; gap: .06em;
    border: 2px solid rgba(0,240,255,.85); border-radius: 10px;
    box-shadow: 0 0 6px rgba(0,240,255,.9), 0 0 18px rgba(0,240,255,.5), inset 0 0 10px rgba(0,240,255,.35);
    text-shadow: 0 0 2px #fff, 0 0 7px var(--magenta), 0 0 16px var(--magenta), 0 0 34px var(--magenta);
    opacity: 0;
  }
  .sign.on { opacity: 1; animation: ignite 1.1s steps(1, end) both; }
  .sign .flaky { animation: flaky 7.3s steps(1, end) 3s infinite; }
  .sign.glitch { animation: none; opacity: .25; transform: translateX(6px) skewY(-4deg); filter: hue-rotate(90deg); }
  @keyframes ignite { 0% { opacity: 0; } 12% { opacity: 1; } 18% { opacity: .1; } 30% { opacity: 1; } 36% { opacity: .3; } 44%, 100% { opacity: 1; } }
  @keyframes flaky { 0%, 91% { opacity: 1; } 92% { opacity: .2; } 93% { opacity: 1; } 95% { opacity: .35; } 96%, 100% { opacity: 1; } }
  .prompt {
    position: fixed; left: max(18px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); margin: 0; pointer-events: none;
    font: 12px/1.4 ui-monospace, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: .06em; color: rgba(0,240,255,.72);
    text-shadow: 0 0 6px rgba(0,240,255,.6); opacity: 0; transition: opacity .6s;
  }
  .prompt.on { opacity: 1; }
  .prompt::after { content: '_'; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .crt::after { animation: none; display: none; }
    .sign.on { animation: none; } .sign .flaky { animation: none; }
    .prompt::after { animation: none; }
  }

  /* site navigation: back to the overview, previous / next tree */
  .tnav { position: fixed; z-index: 50; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
    background: rgba(8, 8, 12, .45); color: rgba(255, 255, 255, .9); font: 500 13px/1 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; letter-spacing: .02em;
    opacity: .66; transition: opacity .25s ease; -webkit-user-select: none; user-select: none; }
  .tnav:hover, .tnav:focus-within { opacity: 1; }
  .tnav a, .tnav span { display: inline-flex; align-items: center; justify-content: center; height: 30px; min-width: 32px; padding: 0 10px; border-radius: 999px; color: inherit; text-decoration: none; }
  .tnav a:hover { background: rgba(255, 255, 255, .16); }
  .tnav a:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  .tnav .arr { font-size: 18px; padding: 0 8px; }
  .tnav span { min-width: 0; padding: 0 2px; opacity: .72; font-variant-numeric: tabular-nums; }
  .tnav.light { background: rgba(255, 255, 255, .62); color: rgba(32, 28, 24, .86); }
  .tnav.light a:hover { background: rgba(0, 0, 0, .08); }
  @media (hover: none) { .tnav { opacity: .82; } .tnav a { height: 36px; min-width: 38px; } }
</style>
</head>
<body>
<nav class="tnav" aria-label="圣诞树十种"><a href="index.html">总览</a><a class="arr" href="tree-03.html" aria-label="上一棵">‹</a><span>04/10</span><a class="arr" href="tree-05.html" aria-label="下一棵">›</a></nav>

<canvas id="bgc" aria-hidden="true"></canvas>
<canvas id="c" role="img" aria-label="赛博朋克风格的霓虹线框圣诞树，立在流动的网格地平线上；拖动可旋转，点击触发故障效果"></canvas>
<div class="crt" aria-hidden="true"></div>
<p class="sign" id="sign" aria-label="圣诞快乐"><span>圣</span><span>诞</span><span class="flaky">快</span><span>乐</span></p>
<p class="prompt" id="prompt"></p>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const sign = document.getElementById('sign'), prompt = document.getElementById('prompt');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touchOnly = matchMedia('(hover: none)').matches;
  prompt.textContent = touchOnly ? '> 左右滑动旋转，轻点制造故障' : '> 拖动旋转，点击制造故障';
  const TAU = Math.PI * 2;
  const MAG = '#ff2bd6', CYA = '#00f0ff', VOLT = '#ffe66b';

  const lines = document.createElement('canvas'), lctx = lines.getContext('2d');
  const bgc = document.getElementById('bgc'), bctx = bgc.getContext('2d');
  const b1 = document.createElement('canvas'), b1x = b1.getContext('2d');
  const b2 = document.createElement('canvas'), b2x = b2.getContext('2d');
  let W, H, DPR, CW, CH, horizon, S, CX, baseY, F, camH;

  // ---------- tree model ----------
  const LV = 11, MER = 14, rings = [];
  for (let i = 0; i < LV; i++) {
    const y = i / (LV - 1) * 0.9, r = 0.44 * (1 - y) * (i % 2 ? 0.74 : 1);
    rings.push({ y, r });
  }
  const garland = [];
  for (let i = 0; i <= 220; i++) { const t = i / 220, y = 0.04 + t * 0.86; garland.push({ y, r: 0.45 * (1 - y) * 0.97 + 0.012, a: t * 3.6 * TAU }); }
  const nodes = [];
  for (let i = 0; i < LV; i += 2) for (let j = 0; j < MER; j++) if (((i * 7 + j * 5) % 9) === 0) nodes.push({ i, j, c: [VOLT, CYA, MAG][(i + j) % 3], p: (i * 13 + j) % 7 });

  function resize() {
    W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 1.5);
    CW = Math.round(W * DPR); CH = Math.round(H * DPR);
    for (const c of [cv, lines]) { c.width = CW; c.height = CH; }
    bgc.width = Math.round((W + 40) * DPR); bgc.height = CH;
    b1.width = Math.max(1, CW >> 2); b1.height = Math.max(1, CH >> 2);
    b2.width = Math.max(1, CW >> 3); b2.height = Math.max(1, CH >> 3);
    const portrait = H > W;
    horizon = H * (portrait ? 0.6 : 0.58);
    S = Math.min(H * (portrait ? 0.52 : 0.64), W * 1.0);
    CX = W / 2; baseY = H * (portrait ? 0.8 : 0.87);
    F = H * 0.9; camH = (H - horizon) * 1.05 / F;
    // sign placement
    const fs = portrait ? Math.max(20, W * 0.06) : Math.max(26, Math.min(46, H * 0.05));
    sign.style.fontSize = fs + 'px';
    if (portrait) { sign.style.right = '6vw'; sign.style.left = 'auto'; sign.style.top = Math.max(26, H * 0.06) + 'px'; }
    else { sign.style.left = 'auto'; sign.style.right = Math.max(40, W * 0.14) + 'px'; sign.style.top = Math.max(40, H * 0.12) + 'px'; }
    paintBg();
    if (reduce) draw(0);
  }

  function paintBg() {
    const g = bctx; g.setTransform(DPR, 0, 0, DPR, 20 * DPR, 0);
    g.fillStyle = '#05010c'; g.fillRect(-20, 0, W + 40, H);
    let gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#05010c'); gr.addColorStop(horizon / H * 0.7, '#14042a'); gr.addColorStop(horizon / H, '#2a0845');
    gr.addColorStop(Math.min(1, horizon / H + 0.002), '#0a0216'); gr.addColorStop(1, '#05010b');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // horizon bloom
    gr = g.createRadialGradient(CX, horizon, 0, CX, horizon, W * 0.7);
    gr.addColorStop(0, 'rgba(255,43,214,.32)'); gr.addColorStop(0.35, 'rgba(140,30,200,.12)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, horizon + H * 0.18);
    // distant skyline: dark blocks, edge-lit
    let x = -10, seed = 3;
    const r = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
    while (x < W + 10) {
      const w = 16 + r() * 50, h = (r() < 0.12 ? 0.09 : 0.02 + r() * 0.045) * H * (Math.abs(x - CX) < W * 0.2 ? 0.5 : 1);
      g.fillStyle = '#0c0320'; g.fillRect(x, horizon - h, w, h);
      g.strokeStyle = r() < 0.5 ? 'rgba(0,240,255,.22)' : 'rgba(255,43,214,.22)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, horizon); g.lineTo(x, horizon - h); g.lineTo(x + w, horizon - h); g.lineTo(x + w, horizon); g.stroke();
      for (let k = 0; k < h * w / 420; k++) {
        g.fillStyle = r() < 0.7 ? 'rgba(255,200,120,.55)' : 'rgba(0,240,255,.6)';
        g.fillRect(x + 3 + r() * (w - 6), horizon - h + 4 + r() * (h - 6), 1.6, 1.6);
      }
      x += w + 2 + r() * 10;
    }
    // stars
    for (let k = 0; k < W * H / 9000; k++) { g.globalAlpha = 0.25 + r() * 0.5; g.fillStyle = '#d8c8ff'; g.fillRect(r() * W, r() * horizon * 0.8, 1, 1); }
    g.globalAlpha = 1;
  }

  // ---------- particles: rising neon embers, pixel snow, glitch shards ----------
  const embers = [], shards = [];
  const pixels = Array.from({ length: touchOnly ? 70 : 130 }, () => ({ x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.05, s: 1 + Math.random() * 2.2, c: Math.random() < 0.7 ? CYA : MAG, p: Math.random() * TAU }));
  function drawParticles(g, dt, boot) {
    const on = reduce ? 1 : Math.min(1, Math.max(0, (boot - 1.2) / 1.2));
    if (!reduce && on > 0 && embers.length < (touchOnly ? 60 : 110) && Math.random() < dt * 40) {
      const a = Math.random() * TAU, rr = 0.25 + Math.random() * 0.5, p = proj(Math.cos(a) * rr, 0, Math.sin(a) * rr);
      embers.push({ x: p[0], y: p[1], vx: (Math.random() - 0.5) * 14, vy: -(30 + Math.random() * 70), life: 0, max: 1.6 + Math.random() * 1.8, c: Math.random() < 0.55 ? MAG : Math.random() < 0.8 ? CYA : VOLT, s: 1.2 + Math.random() * 1.8 });
    }
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i]; e.life += dt;
      if (e.life > e.max) { embers.splice(i, 1); continue; }
      e.x += (e.vx + Math.sin(e.life * 3 + i) * 10) * dt; e.y += e.vy * dt;
      const k = 1 - e.life / e.max;
      g.globalAlpha = k * on; g.fillStyle = e.c; g.fillRect(e.x - e.s / 2, e.y - e.s / 2, e.s, e.s * 2.4);
    }
    for (const p of pixels) {
      if (!reduce) { p.y += p.v * dt; if (p.y > 1.02) { p.y = -0.02; p.x = Math.random(); } }
      const fl = reduce ? 0.6 : 0.35 + 0.65 * (Math.sin(T * 3 + p.p) > 0.85 ? 1 : 0.45);
      g.globalAlpha = fl * on * 0.7; g.fillStyle = p.c; g.fillRect(Math.round(p.x * W), Math.round(p.y * H), p.s, p.s);
    }
    for (let i = shards.length - 1; i >= 0; i--) {
      const sh = shards[i]; sh.life += dt;
      if (sh.life > sh.max) { shards.splice(i, 1); continue; }
      sh.vx *= Math.pow(0.2, dt); sh.vy *= Math.pow(0.2, dt); sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      g.globalAlpha = 1 - sh.life / sh.max; g.fillStyle = sh.c; g.fillRect(sh.x, sh.y, sh.w, sh.h);
    }
    g.globalAlpha = 1;
  }
  function shatter(x, y) {
    for (let i = 0; i < (touchOnly ? 40 : 70); i++) {
      const a = Math.random() * TAU, sp = 80 + Math.random() * 420;
      shards.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.6, life: 0, max: 0.5 + Math.random() * 0.7, c: [CYA, MAG, VOLT, '#ffffff'][i % 4], w: 2 + Math.random() * 10, h: 1 + Math.random() * 2.5 });
    }
  }

  // ---------- state ----------
  let T = 0, t0 = 0, last = 0, rot = 0.4, vel = 0, auto = 0.28, scroll = 0;
  let glitchT = -9, dragging = false, lastX = 0, moved = 0, interacted = false, signOn = false;
  const ptr = { x: 0.5, tx: 0.5 };

  const proj = (x, y, z) => { // tree-space → screen; y up, unit = tree height
    const k = 3.2 / (3.2 + z);
    return [CX + x * k * S, baseY - y * k * S, k];
  };

  function strokeBatch(g, segs, color, width, alpha) {
    if (!segs.length) return;
    g.globalAlpha = alpha; g.strokeStyle = color; g.lineWidth = width; g.beginPath();
    for (const s of segs) { g.moveTo(s[0], s[1]); g.lineTo(s[2], s[3]); }
    g.stroke();
  }

  function draw(dt) {
    const boot = reduce ? 9 : T;
    const g = lctx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
    g.lineCap = 'round'; g.globalCompositeOperation = 'lighter';
    const par = (ptr.x - 0.5) * (reduce ? 0 : 1);

    // floor grid: lines rushing toward the viewer
    const gridOn = Math.min(1, Math.max(0, (boot - 0.35) / 0.9));
    if (gridOn > 0) {
      const dz = 0.55, vpX = CX - par * 30;
      for (let k = 0; k < 26; k++) {
        const z = 1 + k * dz - (scroll % dz);
        if (z < 0.8) continue;
        const y = horizon + camH * F / z;
        if (y > H + 2) continue;
        const a = Math.min(1, 2.6 / z) * 0.75 * gridOn * Math.min(1, (y - horizon) / 6);
        g.globalAlpha = a; g.strokeStyle = CYA; g.lineWidth = Math.max(0.6, 2.2 / z);
        g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      }
      const gr = g.createLinearGradient(0, H, 0, horizon);
      gr.addColorStop(0, 'rgba(0,240,255,.85)'); gr.addColorStop(0.75, 'rgba(0,240,255,.18)'); gr.addColorStop(1, 'rgba(0,240,255,0)');
      g.globalAlpha = gridOn; g.strokeStyle = gr; g.lineWidth = 1.2; g.beginPath();
      for (let k = -24; k <= 24; k++) {
        const X = k * 0.5 - par * 0.4, xb = vpX + X * F / 0.6;
        g.moveTo(vpX + (xb - vpX) * 1, horizon + camH * F / 0.6); g.lineTo(vpX, horizon);
      }
      g.stroke();
    }

    // tree
    const prog = reduce ? 1 : Math.min(1, Math.max(0, (boot - 0.8) / 1.7));
    const cr = Math.cos(rot), sr = Math.sin(rot);
    const jit = (T - glitchT < 0.35) ? 1 : 0;
    const V = [];
    for (let i = 0; i < LV; i++) {
      const row = [];
      for (let j = 0; j < MER; j++) {
        const a = j / MER * TAU + (i % 2 ? Math.PI / MER : 0);
        const x0 = Math.cos(a) * rings[i].r, z0 = Math.sin(a) * rings[i].r;
        const x = x0 * cr - z0 * sr, z = x0 * sr + z0 * cr;
        const p = proj(x + (jit ? (Math.random() - 0.5) * 0.03 : 0), rings[i].y, z);
        row.push([p[0], p[1], z]);
      }
      V.push(row);
    }
    const apex = proj(0, 1, 0);
    const front = { ring: [], spoke: [] }, back = { ring: [], spoke: [] };
    for (let i = 0; i < LV; i++) {
      const ringP = Math.min(1, Math.max(0, prog * LV * 1.25 - i));
      if (ringP <= 0) continue;
      const segN = Math.ceil(MER * ringP);
      for (let j = 0; j < segN; j++) {
        const A = V[i][j], B = V[i][(j + 1) % MER], bin = (A[2] + B[2]) > 0 ? back : front;
        bin.ring.push([A[0], A[1], B[0], B[1]]);
        if (ringP >= 1 && prog > 0.25) {
          const C = i < LV - 1 ? V[i + 1][j] : [apex[0], apex[1], 0];
          if (i < LV - 1 && (Math.min(1, Math.max(0, prog * LV * 1.25 - i - 1)) <= 0)) continue;
          (((A[2] + C[2]) > 0) ? back : front).spoke.push([A[0], A[1], C[0], C[1]]);
          if (i < LV - 1) { const C2 = V[i + 1][(j + (i % 2 ? 1 : 0)) % MER]; (((A[2] + C2[2]) > 0) ? back : front).spoke.push([A[0], A[1], C2[0], C2[1]]); }
        }
      }
    }
    strokeBatch(g, back.spoke, CYA, 1, 0.16);
    strokeBatch(g, back.ring, CYA, 1.1, 0.3);
    strokeBatch(g, front.spoke, CYA, 1.1, 0.5);
    strokeBatch(g, front.ring, CYA, 1.6, 0.95);

    // garland helix traced after the frame
    const gp = reduce ? 1 : Math.min(1, Math.max(0, (boot - 1.9) / 1.0));
    if (gp > 0) {
      const n = Math.floor(garland.length * gp), fb = [], bb = [];
      let prev = null;
      for (let k = 0; k < n; k++) {
        const q = garland[k], x0 = Math.cos(q.a) * q.r, z0 = Math.sin(q.a) * q.r;
        const x = x0 * cr - z0 * sr, z = x0 * sr + z0 * cr, p = proj(x, q.y, z);
        if (prev) (z > 0 ? bb : fb).push([prev[0], prev[1], p[0], p[1]]);
        prev = p;
      }
      strokeBatch(g, bb, MAG, 1.4, 0.35);
      strokeBatch(g, fb, MAG, 2.6, 1);
    }

    // nodes
    if (prog >= 1) {
      for (const nd of nodes) {
        const v = V[nd.i][nd.j]; if (v[2] > 0.05) continue;
        const pulse = reduce ? 0.8 : 0.55 + 0.45 * Math.sin(T * 2.4 + nd.p);
        g.globalAlpha = pulse; g.fillStyle = nd.c;
        g.beginPath(); g.arc(v[0], v[1], 2.6, 0, TAU); g.fill();
      }
    }

    // star: wire pentagram that spins on its own axis
    const sp = reduce ? 1 : Math.min(1, Math.max(0, (boot - 2.6) / 0.5));
    if (sp > 0) {
      const flick = reduce || boot > 3.25 ? 1 : ([1, 0, 1, 0.2, 1][Math.floor((boot - 2.6) * 16) % 5]);
      const c = proj(0, 1.075, 0), R = S * 0.07, sa = reduce ? 0.5 : T * 1.3, sx = Math.cos(sa);
      const pts = [];
      for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * 2 * TAU / 5; pts.push([c[0] + Math.cos(a) * R * sx, c[1] + Math.sin(a) * R]); }
      g.globalAlpha = flick; g.strokeStyle = VOLT; g.lineWidth = 2.2; g.beginPath();
      pts.forEach((p, k) => k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.stroke();
      g.globalAlpha = 0.7 * flick; g.lineWidth = 1.2; g.beginPath();
      g.moveTo(c[0] - R * 1.9, c[1]); g.lineTo(c[0] + R * 1.9, c[1]); g.moveTo(c[0], c[1] - R * 1.9); g.lineTo(c[0], c[1] + R * 1.9); g.stroke();
    }

    // holo base rings
    if (gridOn > 0) {
      for (const [rr, a, w] of [[0.5, 0.75, 1.6], [0.6, 0.35, 1]]) {
        g.globalAlpha = a * gridOn; g.strokeStyle = MAG; g.lineWidth = w; g.beginPath();
        for (let k = 0; k <= 48; k++) {
          const an = k / 48 * TAU + rot * 0.5, x0 = Math.cos(an) * rr, z0 = Math.sin(an) * rr, p = proj(x0, -0.015, z0);
          k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]);
        }
        g.stroke();
      }
    }

    drawParticles(g, dt, boot);

    // ---- composite: background, lines, cheap two-level bloom ----
    const m = ctx; m.setTransform(1, 0, 0, 1, 0, 0);
    m.globalCompositeOperation = 'source-over'; m.globalAlpha = 1;
    const crtOpen = reduce ? 1 : Math.min(1, boot / 0.35);
    m.clearRect(0, 0, CW, CH);
    bgc.style.transform = `translateX(${(par * -14).toFixed(1)}px)`;
    m.save();
    if (crtOpen < 1) { // CRT power-on: a bright line that opens into the picture
      const h = Math.max(2, CH * Math.pow(crtOpen, 3));
      m.fillStyle = '#000'; m.fillRect(0, 0, CW, (CH - h) / 2); m.fillRect(0, (CH + h) / 2, CW, (CH - h) / 2 + 1);
      m.beginPath(); m.rect(0, (CH - h) / 2, CW, h); m.clip();
    }
    m.drawImage(lines, 0, 0);
    b1x.clearRect(0, 0, b1.width, b1.height); b1x.drawImage(lines, 0, 0, b1.width, b1.height);
    b2x.clearRect(0, 0, b2.width, b2.height); b2x.drawImage(b1, 0, 0, b2.width, b2.height);
    m.globalCompositeOperation = 'lighter';
    m.globalAlpha = 0.85; m.drawImage(b1, 0, 0, CW, CH);
    m.globalAlpha = 0.95; m.drawImage(b2, 0, 0, CW, CH);
    if (crtOpen < 1) { m.globalAlpha = 1 - crtOpen; m.fillStyle = '#d8f6ff'; m.fillRect(0, CH / 2 - 1.5 * DPR, CW, 3 * DPR); }
    m.restore();

    // glitch: displaced slices + chromatic ghost
    const ga = T - glitchT;
    if (ga >= 0 && ga < 0.45) {
      m.globalCompositeOperation = 'source-over'; m.globalAlpha = 1;
      const n = 7 + Math.floor(Math.random() * 6);
      for (let k = 0; k < n; k++) {
        const y = Math.random() * CH, h = (4 + Math.random() * 40) * DPR, dx = (Math.random() - 0.5) * 90 * DPR * (1 - ga / 0.45);
        m.drawImage(cv, 0, y, CW, h, dx, y, CW, h);
      }
      m.globalCompositeOperation = 'lighter'; m.globalAlpha = 0.35 * (1 - ga / 0.45);
      m.drawImage(cv, 7 * DPR, 0); m.drawImage(cv, -5 * DPR, 2 * DPR);
    }
    m.globalAlpha = 1; m.globalCompositeOperation = 'source-over';
  }

  function loop() {
    const t = performance.now() / 1000, dt = last ? Math.min(0.05, t - last) : 0.016; last = t;
    if (!t0) t0 = t; T = t - t0 + 0.016;
    if (!dragging) { vel += (auto - vel) * Math.min(1, dt * 1.2); rot += vel * dt; }
    scroll += dt * 0.9;
    ptr.x += (ptr.tx - ptr.x) * Math.min(1, dt * 3);
    draw(dt);
    if (!signOn && T > 2.9) { signOn = true; sign.classList.add('on'); }
    if (T > 3.6 && !interacted && !prompt.dataset.shown) { prompt.dataset.shown = 1; prompt.classList.add('on'); setTimeout(() => prompt.classList.remove('on'), 6000); }
    requestAnimationFrame(loop);
  }

  // ---------- interaction ----------
  let lastY = 0;
  cv.addEventListener('pointerdown', e => { dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); vel = 0; });
  cv.addEventListener('pointermove', e => {
    ptr.tx = e.clientX / W;
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX; moved += Math.abs(dx);
    const k = 6 / Math.min(W, 900); rot += dx * k; vel = reduce ? 0 : vel * 0.6 + dx * k * 60 * 0.4;
    if (reduce) draw(0);
  });
  const up = () => {
    if (!dragging) return; dragging = false;
    if (moved < 6) { // a click, not a drag: glitch
      if (!interacted) { interacted = true; prompt.classList.remove('on'); }
      if (!reduce) { glitchT = T; vel += (Math.random() < 0.5 ? -1 : 1) * 2.4; shatter(lastX, lastY); sign.classList.add('glitch'); setTimeout(() => sign.classList.remove('glitch'), 260); }
    } else if (!interacted) { interacted = true; prompt.classList.remove('on'); }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  addEventListener('resize', resize);
  resize();
  if (reduce) { sign.classList.add('on'); prompt.textContent = touchOnly ? '> 左右滑动旋转' : '> 拖动旋转'; prompt.classList.add('on'); draw(0); }
  else requestAnimationFrame(loop);
})();
</script>
</body>
</html>
