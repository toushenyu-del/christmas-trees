<script>
(() => {
  'use strict';
  let glc = document.getElementById('gl');
  const ov = document.getElementById('ov');
  const octx = ov.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touchOnly = matchMedia('(hover: none)').matches;
  const hint = document.getElementById('hint');
  hint.textContent = touchOnly ? '滑动旋转，轻触绽放，双击重新凝聚' : '拖动旋转，点击绽放，双击重新凝聚';

  const TAU = Math.PI * 2, D = 3.0, TILT = 0.27, cT = Math.cos(TILT), sT = Math.sin(TILT);
  const rnd = Math.random;
  const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  let W = 0, H = 0, DPR = 1, S = 0, CX = 0, CY = 0, FLOOR = 0, q = 1;

  // ================= renderer =================
  // The scene is painted into an offscreen buffer: a brushed sky, then every particle as a stroke of
  // thick paint (lit from the upper left), then the light on top. A last pass reads the paint's
  // brightness as its thickness and lights that relief, so strokes stand up off the canvas (impasto).
  let gl = null, R2D = null;
  try { gl = glc.getContext('webgl', { antialias: false, alpha: false, depth: false, premultipliedAlpha: false, powerPreference: 'high-performance' }); } catch (e) { gl = null; }
  const P = {}; let quad = null, vbo = null, skyRT = null, paintRT = null;
  function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
  function prog(vs, fs, names, attr0) {
    const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, attr0); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; for (const n of names) u[n] = gl.getUniformLocation(p, n); return { p, u };
  }
  const HP = '#ifdef GL_FRAGMENT_PRECISION_HIGH\nprecision highp float;\n#else\nprecision mediump float;\n#endif\n';
  const VS_Q = 'attribute vec2 p; varying vec2 vUv; void main(){ vUv = p * 0.5 + 0.5; gl_Position = vec4(p, 0.0, 1.0); }';
  const FS_SKY = HP + `
uniform vec2 uRes, uC, uStar; uniform float uS, uScale, uT, uTw, uFloor, uStarOn;
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }
float vnp(vec2 p, float per){ vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f); float x0 = mod(i.x, per), x1 = mod(i.x + 1.0, per);
  return mix(mix(h21(vec2(x0, i.y)), h21(vec2(x1, i.y)), f.x), mix(h21(vec2(x0, i.y + 1.0)), h21(vec2(x1, i.y + 1.0)), f.x), f.y); }
float tone(float n){ float b = floor(n * 5.0); return (b + smoothstep(0.32, 0.68, fract(n * 5.0))) / 5.0; }   // paint goes on in steps, not gradients
void main(){
  vec2 fc = gl_FragCoord.xy / uScale; fc.y = uRes.y - fc.y;
  float m = max(uRes.x, uRes.y);
  float d = length((fc - uC + vec2(0.0, uS * 0.1)) / m);
  vec3 col = mix(vec3(0.075, 0.062, 0.19), vec3(0.025, 0.024, 0.075), smoothstep(0.0, 0.45, d));
  col = mix(col, vec3(0.006, 0.006, 0.02), smoothstep(0.4, 1.0, d));
  vec2 n1 = (fc - uC - vec2(-uS * 0.75 + sin(uT * 0.05) * 30.0, -uS * 0.35)) / (uS * 0.7);
  vec2 n2 = (fc - uC - vec2(uS * 0.8, -uS * 0.05 + cos(uT * 0.04) * 24.0)) / (uS * 0.62);
  col += vec3(0.16, 0.06, 0.24) * exp(-dot(n1, n1)) * 0.55 + vec3(0.03, 0.12, 0.17) * exp(-dot(n2, n2)) * 0.5;
  // brushwork: rings of paint swirling round the crown, a halo of strokes round the tree, slow waves elsewhere
  vec2 ds = fc - uStar; float rs = length(ds) / uS;
  float as = atan(ds.y, ds.x) / 6.2831853 + 0.5 + uT * 0.012 / (rs + 0.3);
  float sS = vnp(vec2(as * 30.0, rs * uS / 9.0), 30.0) * 0.7 + vnp(vec2(as * 60.0, rs * uS / 5.0 + 3.1), 60.0) * 0.3;
  vec2 dt = (fc - vec2(uC.x, uC.y + uS * 0.06)) * vec2(1.0, 1.15);
  float wob = vn(fc / (uS * 0.22) + 2.7) - 0.5;
  float rt = length(dt) / uS + wob * 0.1;
  float at = atan(dt.y, dt.x) / 6.2831853 + 0.5 - uT * 0.004 + wob * 0.03;
  float sTr = vnp(vec2(at * 52.0, rt * uS / 11.0), 52.0) * 0.7 + vnp(vec2(at * 104.0, rt * uS / 6.0 + 5.3), 104.0) * 0.3;
  vec2 wq = vec2(fc.x + sin(fc.y / uS * 4.0 + uT * 0.06) * uS * 0.06, fc.y + sin(fc.x / uS * 2.6 - uT * 0.04) * uS * 0.035) / vec2(uS * 0.09, uS * 0.018);
  float sW = vn(wq) * 0.7 + vn(wq * vec2(1.7, 2.1) + 9.2) * 0.3;
  float wS = exp(-rs * rs * 9.0) * (0.3 + 0.7 * uStarOn), wT = exp(-pow((rt - 0.62) / 0.2, 2.0)) * 0.7, wW = 0.5;
  float st = tone((sS * wS + sTr * wT + sW * wW) / (wS + wT + wW));
  vec3 tint = mix(vec3(0.8, 0.92, 1.28), vec3(1.22, 0.86, 1.04), smoothstep(0.32, 0.68, vn(wq * 0.22 + 4.0)));
  col *= mix(0.78, 1.24, st) * mix(vec3(1.0), tint, 0.5);
  col += vec3(1.0, 0.74, 0.38) * exp(-rs * 4.6) * (0.04 + 0.2 * tone(sS)) * uStarOn;               // thick gold rings of light round the crown
  col += vec3(0.95, 0.58, 0.32) * exp(-pow((rt - 0.48) / 0.3, 2.0)) * 0.05 * tone(sTr);            // warm aura round the tree
  // glossy floor laid in long horizontal strokes, with a warm pool of light
  float fl = smoothstep(uFloor - 2.0, uFloor + 6.0, fc.y);
  float sF = tone(vn(vec2(fc.x / (uS * 0.15), fc.y / (uS * 0.012))) * 0.75 + vn(vec2(fc.x / (uS * 0.05), fc.y / (uS * 0.007) + 3.0)) * 0.25);
  col = mix(col, (col * 0.55 + vec3(0.01, 0.008, 0.02)) * mix(0.7, 1.3, sF), fl);
  vec2 q = (fc - vec2(uC.x, uFloor + uS * 0.03)) / vec2(uS * 0.75, uS * 0.09);
  col += vec3(1.0, 0.68, 0.36) * exp(-dot(q, q)) * 0.1 * mix(0.6, 1.4, sF);
  col += vec3(1.0, 0.8, 0.55) * exp(-abs(fc.y - uFloor) * 0.22) * exp(-pow((fc.x - uC.x) / (uS * 0.9), 2.0)) * 0.05;
  // stars dabbed on with the tip of the brush
  vec2 cell = floor(fc / 7.0), f = fract(fc / 7.0);
  float r = h21(cell);
  if (r > 0.986 && fc.y < uFloor) {
    vec2 sp = vec2(h21(cell + 7.1), h21(cell + 3.7)) * 0.6 + 0.2;
    float b = (r - 0.986) / 0.014;
    float tw = mix(1.0, 0.6 + 0.4 * sin(uT * (1.0 + b * 3.0) + r * 60.0), uTw);
    col += vec3(0.95, 0.92, 0.85) * (1.0 - smoothstep(0.16, 0.3, length(f - sp))) * (0.2 + 0.55 * b * b) * tw;
  }
  gl_FragColor = vec4(col, 1.0);
}`;
  const FS_COPY = 'precision mediump float; uniform sampler2D uTex; varying vec2 vUv; void main(){ gl_FragColor = vec4(texture2D(uTex, vUv).rgb, 1.0); }';
  const VS_PT = `attribute vec2 aPos; attribute vec4 aCol; attribute vec4 aSt; attribute float aSeed;
uniform vec2 uRes; uniform float uDpr, uMirror, uFloor, uFade;
varying vec4 vCol; varying vec4 vSt;
void main(){
  vec2 pos = aPos; float a = aCol.a, dl = length(aSt.zw);
  vec2 dir = dl > 1e-5 ? aSt.zw / dl : vec2(1.0, 0.0);
  if (uMirror > 0.0) {               // reflection in the glossy floor (uMirror is its strength)
    float dy = uFloor - pos.y; pos.y = uFloor + dy * 0.82;
    a *= 0.3 * uMirror * exp(-max(dy, 0.0) / uFade); if (dy < -4.0) a = 0.0; dir.y = -dir.y;
  }
  vec2 c = pos / uRes * 2.0 - 1.0; c.y = -c.y;
  gl_Position = vec4(c, 0.0, 1.0);
  gl_PointSize = max(1.0, aSt.x * uDpr);
  vCol = vec4(aCol.rgb, a); vSt = vec4(aSt.y, dir, aSeed);
}`;
  const FS_PT = HP + `
varying vec4 vCol; varying vec4 vSt;
float h1(float n){ return fract(sin(n) * 43758.5453); }
void main(){
  vec2 p = gl_PointCoord * 2.0 - 1.0;
  float mode = vSt.x, seed = vSt.w;
  if (mode > 2.5 && mode < 3.95) {                   // one stroke of a loaded brush: fat start, dry tail, bristle grooves
    float soft = clamp(fract(mode) / 0.9, 0.0, 1.0);
    vec2 q = vec2(p.x * vSt.y + p.y * vSt.z, -p.x * vSt.z + p.y * vSt.y);
    float u = q.x;
    float taper = smoothstep(-1.0, -0.5, u) * (1.0 - 0.8 * smoothstep(0.1, 0.98, u));
    float w = 0.34 * taper + 0.03;
    float wob = (h1(floor((u + 1.0) * 4.0) + seed * 91.0) - 0.5) * 0.07;
    float e = 0.05 + soft * 0.25;
    float body = (1.0 - smoothstep(w - e, w + e * 0.5, abs(q.y + wob))) * (1.0 - smoothstep(0.84, 1.0, abs(u)));
    float bristle = 0.5 + 0.5 * sin(q.y * 64.0 + seed * 50.0) * sin(q.y * 23.0 + seed * 17.0 + 1.0);
    float dry = smoothstep(0.2, 0.95, u) * step(0.52, bristle);
    float a = body * (1.0 - 0.8 * dry * (1.0 - soft)) * vCol.a;
    if (a < 0.004) discard;
    float ridge = 1.0 - abs(q.y + wob) / max(w, 0.05);
    vec3 c = vCol.rgb * (0.8 + 0.32 * bristle * (1.0 - soft)) * (0.9 + 0.18 * ridge);
    gl_FragColor = vec4(c * a, a);
    return;
  }
  if (mode > 3.95) {                                 // an ornament: a round dab, lit from the upper left, with a thick white highlight
    float d = length(p);
    float edge = 0.88 + (h1(floor(atan(p.y, p.x) * 2.5) + seed * 37.0) - 0.5) * 0.1;
    float body = 1.0 - smoothstep(edge - 0.1, edge, d);
    if (body < 0.01) discard;
    float lam = clamp(0.55 - 0.5 * dot(p, vec2(0.7071)), 0.0, 1.0);
    vec3 c = vCol.rgb * (0.3 + 0.9 * lam);
    c += vCol.rgb * 0.35 * smoothstep(0.5, 0.85, d) * smoothstep(0.2, 0.7, dot(p, vec2(0.7071)));
    float hl = 1.0 - smoothstep(0.1, 0.24, length(p - vec2(-0.3, -0.34)));
    c = mix(c, vec3(1.0, 0.98, 0.93), hl * 0.92);
    float a = body * vCol.a;
    gl_FragColor = vec4(c * a, a);
    return;
  }
  float d = dot(p, p);
  if (d > 1.0) discard;
  if (mode > 1.5) {                                  // four-point star flare for ornaments and sparks
    float ax = abs(p.x), ay = abs(p.y);
    float cross = exp(-ax * 26.0) * exp(-ay * 3.2) + exp(-ay * 26.0) * exp(-ax * 3.2);
    float core = exp(-d * 18.0);
    float a = (cross * 0.9 + core) * vCol.a * (1.0 - d);
    vec3 c = mix(vCol.rgb, vec3(1.0, 0.97, 0.92), core * 0.5);
    gl_FragColor = vec4(c * a, a);
    return;
  }
  float soft = mode;
  float core = exp(-d * mix(30.0, 3.2, soft));
  float halo = exp(-d * 5.0) * mix(0.32, 0.0, soft);
  float a = (core + halo) * vCol.a * (1.0 - d);
  vec3 c = mix(vCol.rgb, vec3(1.0, 0.97, 0.9), core * 0.28 * (1.0 - soft));
  gl_FragColor = vec4(c * a, a);
}`;
  // impasto: brightness is read as paint thickness, and that relief is lit from the upper left
  const FS_POST = HP + `
uniform sampler2D uTex; uniform vec2 uTexel; uniform float uRelief, uT, uPx;
varying vec2 vUv;
float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float th(vec2 uv){ vec3 c = texture2D(uTex, uv).rgb; return sqrt(dot(c, vec3(0.3, 0.55, 0.15))); }
void main(){

    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function adapt(dt) {                                  // keep it smooth: paint at a lower resolution if frames run long
    acc += dt; frames++;
    if (acc < 1.5) return;
    const avg = acc / frames * 1000; acc = 0; frames = 0;
    if (gl && avg > 22 && q > 0.62) { q = Math.max(0.6, q * 0.85); buildRT(); }
  }
  function loop() {
    const t = performance.now() / 1000, dt = last ? Math.min(0.05, t - last) : 0.016; last = t;
    if (!t0) t0 = t; T = t - t0 + 0.016;
    gestureTick(t * 1000);
    const hand = gest.on && T - gest.seen < 0.7, gt = hand ? gest.target : 0;
    gS += (gt - gS) * (1 - Math.exp(-dt * (gt > gS ? 4.5 : 3.2)));
    let steer = 0;
    if (hand) { const off = gest.hx - 0.5; steer = Math.abs(off) < 0.12 ? 0 : (off - Math.sign(off) * 0.12) * 4; }   // move the hand sideways to turn the tree
    if (!dragging) { spin += (TAU / 42 + steer - spin) * Math.min(1, dt * 1.4); rot += spin * dt; }
    render(dt);
    if (T > 5) adapt(dt);
    if (!readyShown && T > 3.4) { readyShown = true; document.body.classList.add('ready'); }
    if (!interacted && !hintShown && T > 4.6) { hintShown = true; hint.classList.add('on'); setTimeout(() => hint.classList.remove('on'), 6000); }
    requestAnimationFrame(loop);
  }

  // ================= gesture: open a hand in front of the camera and the tree scatters =================
  // Hand tracking is MediaPipe's hand landmarker, loaded from the CDN only when the viewer asks for it.
  const gbtn = document.getElementById('gbtn'), gcam = document.getElementById('gcam'), gvid = document.getElementById('gvid');
  const gsk = document.getElementById('gsk'), gbar = document.getElementById('gbar'), gmsg = document.getElementById('gmsg');
  const MP = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
  const BONES = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12], [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
  const gest = { on: false, busy: false, stream: null, lm: null, seen: -9, open: 0, target: 0, hx: 0.5, lastVT: -1, lastRun: 0 };
  let msgTimer = 0;
  function say(text, ms) { gmsg.textContent = text; gmsg.classList.add('on'); clearTimeout(msgTimer); if (ms) msgTimer = setTimeout(() => gmsg.classList.remove('on'), ms); }
  async function gestureStart() {
    if (gest.busy) return;
    gest.busy = true; noteInteract();
    try {
      const policy = document.permissionsPolicy || document.featurePolicy;      // a host page can forbid the camera outright
      if (policy && policy.allowsFeature && !policy.allowsFeature('camera')) { const e = new Error('camera blocked by the host page'); e.name = 'NotAllowedError'; throw e; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { const e = new Error('no camera api'); e.name = window.isSecureContext ? 'NotFoundError' : 'Insecure'; throw e; }
      say('正在打开摄像头…');
      gest.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false });
      gvid.srcObject = gest.stream; await gvid.play();
      gcam.hidden = false; gbtn.setAttribute('aria-pressed', 'true'); gest.on = true;
      if (!gest.lm) {
        say('正在加载手势识别（第一次约 10 MB，请稍等）…');
        const vision = await import(MP + '/vision_bundle.mjs');
        const files = await vision.FilesetResolver.forVisionTasks(MP + '/wasm');
        const opts = d => ({ baseOptions: { modelAssetPath: HAND_MODEL, delegate: d }, runningMode: 'VIDEO', numHands: 1, minHandDetectionConfidence: 0.5, minHandPresenceConfidence: 0.5, minTrackingConfidence: 0.5 });
        try { gest.lm = await vision.HandLandmarker.createFromOptions(files, opts('GPU')); }
        catch (e) { gest.lm = await vision.HandLandmarker.createFromOptions(files, opts('CPU')); }
      }
      if (gest.on) say('张开手掌，树会散开；握拳，树会聚拢。手往左右移，树跟着转。', 6500);
    } catch (e) {
      gestureStop();
      const n = e && e.name, framed = window.top !== window;
      say(n === 'NotAllowedError' || n === 'SecurityError'
            ? (framed ? '这个打开方式不允许网页使用摄像头。请在 Safari 或 Chrome 里直接打开这个网页。' : '没有拿到摄像头权限。请在浏览器的网站设置里允许使用摄像头，再点一次「手势」。')
          : n === 'Insecure' ? '摄像头只能在 https 网页里使用。'
          : n === 'NotFoundError' || n === 'OverconstrainedError' ? '没有找到可用的前置摄像头。'
          : n === 'NotReadableError' ? '摄像头正被别的应用占用，关掉它再试一次。'
          : '手势识别没能加载：网络不通，或当前打开方式不支持。树的其他玩法不受影响。', 8000);
    } finally { gest.busy = false; }
  }
  function gestureStop() {
    gest.on = false; gest.target = 0; gest.seen = -9;
    if (gest.stream) { gest.stream.getTracks().forEach(tr => tr.stop()); gest.stream = null; }
    gvid.srcObject = null; gcam.hidden = true; gbtn.setAttribute('aria-pressed', 'false'); gbar.style.width = '0%';
  }
  gbtn.addEventListener('click', () => { if (gest.on) { gestureStop(); say('手势控制已关闭', 2000); } else gestureStart(); });
  addEventListener('pagehide', gestureStop);
  // how open the hand is, 0 (fist) .. 1 (spread), from 3D landmarks so distance to the camera does not matter
  const dist3 = (p, q) => Math.hypot(p.x - q.x, p.y - q.y, (p.z || 0) - (q.z || 0));
  function openness(w) {
    const palm = dist3(w[0], w[9]) + 1e-6;
    let s = 0;
    for (const [m, tip] of [[5, 8], [9, 12], [13, 16], [17, 20]]) s += clamp01((dist3(w[0], w[tip]) / (dist3(w[0], w[m]) + 1e-6) - 1.25) / 0.6);
    s += 0.6 * clamp01((dist3(w[4], w[5]) / palm - 0.55) / 0.45);
    return s / 4.6;
  }
  function drawHand(L) {
    const w = gvid.videoWidth || 640, h = gvid.videoHeight || 480;
    if (gsk.width !== w || gsk.height !== h) { gsk.width = w; gsk.height = h; }
    const g = gsk.getContext('2d'); g.clearRect(0, 0, w, h);
    if (!L) return;
    const lw = Math.max(2, w / 150);
    g.lineWidth = lw; g.lineCap = 'round'; g.strokeStyle = 'rgba(255, 214, 150, .95)';
    g.beginPath(); for (const [p, q] of BONES) { g.moveTo(L[p].x * w, L[p].y * h); g.lineTo(L[q].x * w, L[q].y * h); } g.stroke();
    g.fillStyle = '#fff4dc'; for (const k of [4, 8, 12, 16, 20]) { g.beginPath(); g.arc(L[k].x * w, L[k].y * h, lw * 1.7, 0, TAU); g.fill(); }
  }
  function gestureTick(now) {
    if (!gest.on || !gest.lm || gvid.readyState < 2) return;
    if (now - gest.lastRun < 55 || gvid.currentTime === gest.lastVT) return;   // about 18 readings a second is plenty
    gest.lastRun = now; gest.lastVT = gvid.currentTime;
    let res; try { res = gest.lm.detectForVideo(gvid, now); } catch (e) { return; }
    const L = res && res.landmarks && res.landmarks[0];
    drawHand(L || null);
    if (L) {
      gest.open = openness((res.worldLandmarks && res.worldLandmarks[0]) || L); gest.seen = T;
      gest.target = clamp01((gest.open - 0.3) / 0.45);
      gest.hx = 1 - (L[0].x + L[9].x) / 2;               // mirrored, so moving the hand right turns the tree right
    }
    gbar.style.width = (L ? Math.round(gest.open * 100) : 0) + '%';
  }
  window.__gesture = () => ({ on: gest.on, ready: !!gest.lm, open: +gest.open.toFixed(3), target: +gest.target.toFixed(3), scatter: +gS.toFixed(3), seen: T - gest.seen < 0.7 });
  if (reduce || !gl) gbtn.hidden = true;                 // the scatter is motion; and without WebGL there is no cloud to fly into

  addEventListener('resize', resize);
  if (reduce) { T = 10; document.body.classList.add('ready'); hint.textContent = touchOnly ? '滑动旋转' : '拖动旋转'; hint.classList.add('on'); }
  resize();
  if (!reduce) requestAnimationFrame(loop);
})();
</script>
</body>
</html>
