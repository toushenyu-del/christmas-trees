<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0907">
<title>金箔 · Art Deco</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
<style>
  :root { --lacquer: #0a0907; --gold: #c9a04a; --emerald: #0e5c4a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(ellipse 80% 70% at 50% 42%, #1a150d 0%, #0d0b08 55%, #050403 100%); }
  body { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  #art { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; cursor: pointer; }
  #dust { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .ln { fill: none; stroke: url(#gold); stroke-linecap: round; stroke-linejoin: round; }
  .fill-em { fill: url(#emer); }
  .plaque { font-family: 'Poiret One', 'Futura', 'Avenir Next', 'Century Gothic', sans-serif; letter-spacing: .42em; fill: url(#gold); }
  .hint { position: fixed; margin: 0; text-align: left; pointer-events: none; max-width: 60vw;
    font: 12px/1.4 'Poiret One', 'PingFang SC', 'Noto Sans SC', sans-serif; letter-spacing: .3em; color: rgba(232, 200, 130, .6); opacity: 0; transition: opacity 1.2s; }
  .hint.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .hint { display: none; } }

  /* site navigation: back to the overview, previous / next tree */
  .tnav { position: fixed; z-index: 50; top: max(10px, env(safe-area-inset-top)); left: max(10px, env(safe-area-inset-left)); display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px;
    background: rgba(8, 8, 12, .45); color: rgba(255, 255, 255, .9); font: 500 13px/1 system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; letter-spacing: .02em;
    opacity: .66; transition: opacity .25s ease; -webkit-user-select: none; user-select: none; }
  .tnav:hover, .tnav:focus-within { opacity: 1; }
  .tnav a, .tnav span { display: inline-flex; align-items: center; justify-content: center; height: 30px; min-width: 32px; padding: 0 10px; border-radius: 999px; color: inherit; text-decoration: none; }
  .tnav a:hover { background: rgba(255, 255, 255, .16); }
  .tnav a:focus-visible { outline: 2px solid currentColor; outline-offset: 1px; }
  .tnav .arr { font-size: 18px; padding: 0 8px; }
  .tnav span { min-width: 0; padding: 0 2px; opacity: .72; font-variant-numeric: tabular-nums; }
  .tnav.light { background: rgba(255, 255, 255, .62); color: rgba(32, 28, 24, .86); }
  .tnav.light a:hover { background: rgba(0, 0, 0, .08); }
  @media (hover: none) { .tnav { opacity: .82; } .tnav a { height: 36px; min-width: 38px; } }
</style>
</head>
<body>
<nav class="tnav" aria-label="圣诞树十种"><a href="index.html">总览</a><a class="arr" href="tree-05.html" aria-label="上一棵">‹</a><span>06/10</span><a class="arr" href="tree-07.html" aria-label="下一棵">›</a></nav>

<svg id="art" role="img" aria-label="装饰艺术风格的金箔圣诞树：阶梯拱门、放射光芒与祖母绿几何树，金面高光随指针移动">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="600">
      <stop offset="0" stop-color="#6b4a17"/><stop offset=".3" stop-color="#b88a35"/>
      <stop id="g1" offset=".44" stop-color="#e9c877"/><stop id="g2" offset=".5" stop-color="#fff2c8"/><stop id="g3" offset=".56" stop-color="#e2bd66"/>
      <stop offset=".72" stop-color="#a87b2c"/><stop offset="1" stop-color="#5e4012"/>
    </linearGradient>
    <linearGradient id="emer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#127560"/><stop offset="1" stop-color="#062c24"/></linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#d9b45e" stroke-opacity=".16" stroke-width="1"/></pattern>
    <radialGradient id="starGlow"><stop offset="0" stop-color="#fff2c8" stop-opacity=".55"/><stop offset=".4" stop-color="#e9c877" stop-opacity=".16"/><stop offset="1" stop-color="#e9c877" stop-opacity="0"/></radialGradient>
    <clipPath id="frameClip"><path id="clipPath"/></clipPath>
  </defs>
  <g id="rays" clip-path="url(#frameClip)"></g>
  <g id="frame"></g>
  <g id="tree"></g>
  <g id="plq"></g>
</svg>
<canvas id="dust" aria-hidden="true"></canvas>
<p class="hint" id="hint">移动指针让光扫过金面，点一下奏响一次光芒</p>
<script>
(() => {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const svg = $('art'), dust = $('dust'), dctx = dust.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const touchOnly = matchMedia('(hover: none)').matches;
  if (touchOnly) $('hint').textContent = '手指划过让光扫过金面，轻点奏响一次光芒';
  const TAU = Math.PI * 2, clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
  const f = n => (Math.round(n * 10) / 10).toString();
  let W, H, DPR, cx, starY, glintPts = [], lines = [], rayEls = [];

  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
  const line = (d, w, parent, order) => { const p = el('path', { d, class: 'ln', 'stroke-width': w }, parent); lines.push({ p, order }); return p; };

  function build() {
    W = innerWidth; H = innerHeight; DPR = Math.min(devicePixelRatio || 1, 2);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    dust.width = Math.round(W * DPR); dust.height = Math.round(H * DPR);
    for (const id of ['rays', 'frame', 'tree', 'plq']) $(id).innerHTML = '';
    lines = []; rayEls = []; glintPts = [];
    const portrait = H > W * 1.05;
    const g = $('gold'); g.setAttribute('x2', W); g.setAttribute('y2', H * 0.6);
    cx = W / 2;

    // ---- stepped arch frame (three nested rules) ----
    const m = Math.max(14, Math.min(W, H) * 0.035);
    const steps = 4, stepW = Math.min(W * 0.06, 70), stepH = Math.min(H * 0.035, 34);
    const archTop = m + (portrait ? H * 0.02 : 0);
    function archPath(inset) {
      const L = m + inset, R = W - m - inset, B = H - m - inset, T = archTop + inset;
      const shoulder = T + steps * stepH;
      let d = `M${f(L)},${f(B)}L${f(L)},${f(shoulder)}`;
      const half = (R - L) / 2, flat = half - steps * stepW;
      d += `L${f(L + flat)},${f(shoulder)}`;
      for (let i = 0; i < steps; i++) { const x = L + flat + i * stepW, y = shoulder - (i + 1) * stepH; d += `L${f(x)},${f(y)}L${f(x + stepW)},${f(y)}`; }
      for (let i = steps - 1; i >= 0; i--) { const x = R - flat - i * stepW, y = shoulder - (i + 1) * stepH; d += `L${f(x)},${f(y)}L${f(x)},${f(y + stepH)}`; }
      d += `L${f(R)},${f(shoulder)}L${f(R)},${f(B)}Z`;
      return d;
    }
    // fix the right-hand steps so they descend symmetrically
    function archPathSym(inset) {
      const L = m + inset, R = W - m - inset, B = H - m - inset, T = archTop + inset;
      const shoulder = T + steps * stepH, half = (R - L) / 2, flat = half - steps * stepW;
      const pts = [[L, B], [L, shoulder], [L + flat, shoulder]];
      for (let i = 0; i < steps; i++) { const x = L + flat + i * stepW, y = shoulder - (i + 1) * stepH; pts.push([x, y], [x + stepW, y]); }
      const left = pts.slice(2).map(([x, y]) => [W - x, y]).reverse();
      const all = pts.concat(left, [[R, shoulder], [R, B]]);
      return 'M' + all.map(p => f(p[0]) + ',' + f(p[1])).join('L') + 'Z';
    }
    void archPath;
    $('clipPath').setAttribute('d', archPathSym(0));
    const hint = $('hint'), fanR = Math.min(W, H) * 0.09;
    hint.style.left = (m + fanR + 26) + 'px'; hint.style.bottom = (m + 18) + 'px';
    line(archPathSym(0), 1.6, $('frame'), 0);
    line(archPathSym(9), 0.8, $('frame'), 0.1);
    line(archPathSym(15), 0.5, $('frame'), 0.2);
    // corner fans
    for (const [x, y, s] of [[m + 15, H - m - 15, 1], [W - m - 15, H - m - 15, -1]]) {
      const r = Math.min(W, H) * 0.09;
      let d = `M${f(x)},${f(y - r)}A${f(r)},${f(r)} 0 0 ${s > 0 ? 1 : 0} ${f(x + s * r)},${f(y)}`;
      for (let k = 1; k < 6; k++) { const a = k / 6 * Math.PI / 2; d += `M${f(x)},${f(y)}L${f(x + s * Math.sin(a) * r)},${f(y - Math.cos(a) * r)}`; }
      d += `M${f(x)},${f(y - r * 0.6)}A${f(r * 0.6)},${f(r * 0.6)} 0 0 ${s > 0 ? 1 : 0} ${f(x + s * r * 0.6)},${f(y)}`;
      line(d, 0.8, $('frame'), 0.3);
    }

    // ---- tree geometry ----
    const Ht = Math.min(H * (portrait ? 0.54 : 0.6), W * (portrait ? 1.15 : 0.85));
    const baseY = H * (portrait ? 0.79 : 0.81), topY = baseY - Ht;
    starY = topY - Ht * 0.02;
    // sunburst behind
    const R = Math.hypot(W, H);
    for (let k = 0; k < 72; k++) {
      const a = k / 72 * TAU, long = k % 2 === 0, r0 = Ht * (long ? 0.09 : 0.14), r1 = long ? R : Ht * 0.62;
      const p = el('path', { d: `M${f(cx + Math.cos(a) * r0)},${f(starY + Math.sin(a) * r0)}L${f(cx + Math.cos(a) * r1)},${f(starY + Math.sin(a) * r1)}`, class: 'ln', 'stroke-width': long ? 0.7 : 0.45, opacity: long ? 0.42 : 0.3 }, $('rays'));
      rayEls.push({ p, k, long });
    }
    el('circle', { cx: f(cx), cy: f(starY), r: f(Ht * 0.34), fill: 'url(#starGlow)', id: 'glow' }, $('rays'));
    // concentric halo rings behind the crown
    for (let i = 1; i <= 3; i++) { const r = Ht * (0.1 + i * 0.07); line(`M${f(cx - r)},${f(starY)}a${f(r)},${f(r)} 0 1 0 ${f(2 * r)},0a${f(r)},${f(r)} 0 1 0 ${f(-2 * r)},0`, 0.6, $('rays'), 1.0 + i * 0.1); }

    const tree = $('tree');
    // pedestal: a stepped ziggurat
    const pw = Ht * 0.16, ph = Ht * 0.045;
    for (let i = 0; i < 3; i++) {
      const w = pw * (1 - i * 0.24), y = baseY + ph * (2 - i);
      el('rect', { x: f(cx - w), y: f(y), width: f(w * 2), height: f(ph), fill: '#0c0a07' }, tree);
      line(`M${f(cx - w)},${f(y + ph)}V${f(y)}H${f(cx + w)}V${f(y + ph)}`, 1.1, tree, 1.4 + i * 0.05);
    }
    // tiers, bottom to top so upper tiers sit in front
    const tiers = 5;
    const T = [];
    for (let k = 0; k < tiers; k++) {
      const u = k / (tiers - 1);                     // 0 bottom → 1 top
      const yb = baseY - Ht * (0.02 + u * 0.66), h = Ht * (0.34 - u * 0.1), hw = Ht * (0.36 - u * 0.24);
      T.push({ yb, ya: yb - h, hw, u });
    }
    T.forEach((t, k) => {
      const grp = el('g', {}, tree);
      const tri = s => { const ya = t.yb - (t.yb - t.ya) * s; return `M${f(cx)},${f(ya)}L${f(cx + t.hw * s)},${f(t.yb)}L${f(cx - t.hw * s)},${f(t.yb)}Z`; };
      el('path', { d: tri(1), class: 'fill-em', opacity: 0, 'data-fill': 1 }, grp);
      el('path', { d: tri(1), fill: 'url(#hatch)', opacity: 0, 'data-fill': 1 }, grp);
      el('path', { d: tri(0.72), fill: '#0b0907', opacity: 0, 'data-fill': 1 }, grp);
      el('path', { d: tri(0.46), class: 'fill-em', opacity: 0, 'data-fill': 1 }, grp);
      const ord = 1.5 + (tiers - 1 - k) * 0.18;
      line(tri(1), 1.6, grp, ord); line(tri(0.86), 0.7, grp, ord + 0.06); line(tri(0.72), 1.1, grp, ord + 0.1); line(tri(0.46), 0.9, grp, ord + 0.14);
      // a row of fans along the tier's base
      const n = Math.max(3, Math.round(t.hw * 2 / (Ht * 0.07))), fw = t.hw * 2 / n;
      let d = '';
      for (let i = 0; i < n; i++) {
        const x0 = cx - t.hw + i * fw, r = fw / 2, xc = x0 + r;
        d += `M${f(x0)},${f(t.yb)}A${f(r)},${f(r)} 0 0 1 ${f(x0 + fw)},${f(t.yb)}`;
        for (let j = 1; j < 4; j++) { const a = Math.PI - j / 4 * Math.PI; d += `M${f(xc)},${f(t.yb)}L${f(xc + Math.cos(a) * r * 0.85)},${f(t.yb - Math.sin(a) * r * 0.85)}`; }
      }
      el('path', { d: `M${f(cx - t.hw)},${f(t.yb)}L${f(cx + t.hw)},${f(t.yb)}L${f(cx + t.hw)},${f(t.yb + 0.1)}Z`, fill: '#0b0907' }, grp);
      line(d, 0.7, grp, ord + 0.2);
      // gold beads at the tier tips
      for (const s of [-1, 1]) { el('circle', { cx: f(cx + s * t.hw), cy: f(t.yb), r: f(Ht * 0.008 + 1.5), fill: 'url(#gold)', opacity: 0, 'data-fill': 1 }, grp); glintPts.push([cx + s * t.hw, t.yb]); }
      glintPts.push([cx, t.ya]);
    });
    // central axis
    line(`M${f(cx)},${f(starY + Ht * 0.06)}V${f(baseY + ph * 3)}`, 0.8, tree, 1.45);
    // crown: an eight-point star from two squares, with an inner ring
    const sr = Ht * 0.07;
    let sd = '';
    for (const rot of [0, Math.PI / 4]) { for (let i = 0; i < 4; i++) { const a = rot + i * Math.PI / 2 - Math.PI / 2; sd += (i ? 'L' : 'M') + f(cx + Math.cos(a) * sr) + ',' + f(starY + Math.sin(a) * sr); } sd += 'Z'; }
    el('path', { d: sd, fill: '#0b0907', opacity: 0, 'data-fill': 1 }, tree);
    line(sd, 1.3, tree, 2.5);
    line(`M${f(cx - sr * 0.42)},${f(starY)}a${f(sr * 0.42)},${f(sr * 0.42)} 0 1 0 ${f(sr * 0.84)},0a${f(sr * 0.42)},${f(sr * 0.42)} 0 1 0 ${f(-sr * 0.84)},0`, 1, tree, 2.6);
    el('circle', { cx: f(cx), cy: f(starY), r: f(sr * 0.2), fill: 'url(#gold)', opacity: 0, 'data-fill': 1 }, tree);
    glintPts.push([cx, starY - sr], [cx + sr, starY], [cx - sr, starY]);

    // plaque with the one line of type
    const py = Math.min(H - m - 26, baseY + ph * 3 + Math.max(36, H * 0.06)), fs = Math.max(13, Math.min(22, Math.min(W, H) * 0.026));
    const pq = $('plq');
    const txt = el('text', { x: f(cx + fs * 0.21), y: f(py), 'text-anchor': 'middle', class: 'plaque', 'font-size': f(fs), opacity: 0, 'data-fill': 1 }, pq);
    txt.textContent = 'MERRY CHRISTMAS';
    const tw = fs * 13.5;
    line(`M${f(cx - tw / 2 - 26)},${f(py - fs * 0.35)}h18M${f(cx + tw / 2 + 8)},${f(py - fs * 0.35)}h18`, 1, pq, 2.7);
    for (const s of [-1, 1]) { const x = cx + s * (tw / 2 + 36); line(`M${f(x)},${f(py - fs * 0.35 - 4)}l4,4l-4,4l-4,-4Z`, 0.9, pq, 2.75); }

    // prepare line drawing
    for (const L of lines) { const len = L.p.getTotalLength ? L.p.getTotalLength() : 1000; L.len = len; if (!reduce) { L.p.style.strokeDasharray = `${len} ${len}`; L.p.style.strokeDashoffset = len; } }
  }

  function intro() {
    for (const L of lines) {
      const delay = 0.15 + L.order * 0.62, dur = Math.min(1.6, 0.5 + L.len / 1400);
      L.p.animate([{ strokeDashoffset: L.len }, { strokeDashoffset: 0 }], { duration: dur * 1000, delay: delay * 1000, easing: 'cubic-bezier(.45,.05,.25,1)', fill: 'forwards' });
    }
    rayEls.forEach(r => {
      const d = 1.25 + (r.k % 2 ? 0.25 : 0) + Math.abs(Math.sin(r.k * 0.5)) * 0.25;
      r.p.animate([{ opacity: 0, transform: 'scale(.7)' }, { opacity: r.long ? 0.42 : 0.3, transform: 'scale(1)' }], { duration: 1200, delay: d * 1000, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'backwards' });
      r.p.style.transformOrigin = `${cx}px ${starY}px`; r.p.style.transformBox = 'view-box';
    });
    document.querySelectorAll('[data-fill]').forEach((e, i) => {
      e.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 900, delay: 2300 + (i % 12) * 40, easing: 'ease-out', fill: 'forwards' });
    });
    $('glow').animate([{ opacity: 0 }, { opacity: 1 }], { duration: 1600, delay: 2500, fill: 'backwards' });
    setTimeout(() => sweep(), 3300);
  }
  function showAll() { document.querySelectorAll('[data-fill]').forEach(e => e.setAttribute('opacity', 1)); }

  // ---------- light: the gold gradient's highlight band follows the pointer ----------
  const light = { x: 0.35, tx: 0.35, sweepAt: -9 };
  function setSheen(p) {
    const c = 0.15 + p * 0.7;
    $('g1').setAttribute('offset', (c - 0.07).toFixed(3)); $('g2').setAttribute('offset', c.toFixed(3)); $('g3').setAttribute('offset', (c + 0.07).toFixed(3));
  }
  function sweep() { light.sweepAt = T; burst(); }

  // ---------- particles: gold dust in the light, glints on the gilding ----------
  const motes = Array.from({ length: touchOnly ? 55 : 95 }, () => ({ x: Math.random(), y: Math.random(), z: 0.3 + Math.random() * 0.7, p: Math.random() * TAU, vx: (Math.random() - 0.5) * 0.004 }));
  const glints = [], sparks = [];
  function burst() {
    for (let i = 0; i < (touchOnly ? 40 : 70); i++) {
      const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
      sparks.push({ x: cx, y: starY, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: 1 + Math.random() * 1.2, s: 1 + Math.random() * 2 });
    }
  }
  function drawDust(dt) {
    const g = dctx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    const vis = reduce ? 1 : clamp01((T - 0.6) / 2);
    for (const m of motes) {
      if (!reduce) { m.y -= dt * 0.006 * m.z; m.x += m.vx * dt + Math.sin(T * 0.3 + m.p) * dt * 0.003; if (m.y < -0.02) { m.y = 1.02; m.x = Math.random(); } }
      const tw = reduce ? 0.7 : 0.45 + 0.55 * Math.pow(0.5 + 0.5 * Math.sin(T * (0.8 + m.z) + m.p), 2);
      const lit = 0.6 + 0.8 * Math.exp(-Math.pow((m.x - light.x) * 3, 2));
      g.globalAlpha = 0.5 * tw * vis * m.z * Math.min(1.4, lit);
      g.fillStyle = '#f3d58c'; g.beginPath(); g.arc(m.x * W, m.y * H, 0.6 + m.z * 1.4, 0, TAU); g.fill();
    }
    if (!reduce && T > 3 && Math.random() < dt * 2.6) {
      const p = glintPts[(Math.random() * glintPts.length) | 0];
      if (p) glints.push({ x: p[0], y: p[1], t: T, s: 7 + Math.random() * 9 });
    }
    for (let i = glints.length - 1; i >= 0; i--) {
      const k = (T - glints[i].t) / 0.8; if (k > 1) { glints.splice(i, 1); continue; }
      const a = Math.sin(k * Math.PI), s = glints[i].s * a, x = glints[i].x, y = glints[i].y;
      g.globalAlpha = a; g.strokeStyle = '#fff3cf'; g.lineWidth = 1.1;
      g.beginPath(); g.moveTo(x - s, y); g.lineTo(x + s, y); g.moveTo(x, y - s); g.lineTo(x, y + s); g.stroke();
      g.globalAlpha = a * 0.5; g.fillStyle = '#fff3cf'; g.beginPath(); g.arc(x, y, 1.6, 0, TAU); g.fill();
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.life += dt; if (p.life > p.max) { sparks.splice(i, 1); continue; }
      p.vx *= Math.pow(0.3, dt); p.vy = p.vy * Math.pow(0.3, dt) + 30 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
      g.globalAlpha = 1 - p.life / p.max; g.fillStyle = '#ffe3a0'; g.beginPath(); g.arc(p.x, p.y, p.s, 0, TAU); g.fill();
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  // ---------- loop ----------
  let T = 0, t0 = 0, last = 0, interacted = false, lastSheen = '';
  function loop() {
    const t = performance.now() / 1000, dt = last ? Math.min(0.05, t - last) : 0.016; last = t;
    if (!t0) t0 = t; T = t - t0 + 0.016;
    light.x += (light.tx - light.x) * Math.min(1, dt * 3);
    let p = light.x;
    const sw = T - light.sweepAt;
    if (sw >= 0 && sw < 1.6) p = -0.2 + (sw / 1.6) * 1.4;                         // a full sweep across the gilding
    else if (!interacted && T > 5) p = light.x + Math.sin(T * 0.35) * 0.12;          // idle: the light breathes
    const key = (Math.round(p * 220) / 220).toFixed(4);   // quantised: the gilding only repaints when the light visibly moves
    if (key !== lastSheen) { setSheen(p); lastSheen = key; }
    // rays pulse outward after a chime
    if (sw >= 0 && sw < 1.6) rayEls.forEach(r => { const k = Math.exp(-Math.pow((sw * 1.4 - (r.long ? 0.4 : 0.6)) * 3, 2)); r.p.style.opacity = (r.long ? 0.42 : 0.3) + k * 0.5; });
    else if (sw >= 1.6 && sw < 1.7) rayEls.forEach(r => { r.p.style.opacity = ''; });
    drawDust(dt);
    if (T > 6 && !interacted && !$('hint').dataset.done) { $('hint').dataset.done = 1; $('hint').classList.add('on'); setTimeout(() => $('hint').classList.remove('on'), 6000); }
    requestAnimationFrame(loop);
  }
  svg.addEventListener('pointermove', e => { light.tx = clamp01(e.clientX / W); if (!interacted && e.pointerType !== 'mouse') {} });
  svg.addEventListener('pointerdown', e => {
    if (!interacted) { interacted = true; $('hint').classList.remove('on'); }
    light.tx = clamp01(e.clientX / W);
    if (!reduce) sweep();
  });
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { build(); showAll(); for (const L of lines) { L.p.style.strokeDasharray = ''; L.p.style.strokeDashoffset = ''; } setSheen(light.x); if (reduce) drawDust(0); }, 150); });
  build();
  if (reduce) { showAll(); setSheen(0.35); T = 9; drawDust(0); }
  else { intro(); requestAnimationFrame(loop); }
})();
</script>
</body>
</html>
